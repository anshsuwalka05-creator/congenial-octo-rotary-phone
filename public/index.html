
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101116;
  color: white;
  font-family: Arial, sans-serif;
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

header {
  padding: 17px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #292a33;
}

.logo {
  font-size: 23px;
  font-weight: bold;
  color: #a78bfa;
}

button {
  cursor: pointer;
  border: 0;
}

#newChat {
  background: #292a36;
  color: white;
  padding: 10px 14px;
  border-radius: 10px;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.message {
  max-width: 90%;
  padding: 13px 15px;
  border-radius: 15px;
  white-space: pre-wrap;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.user {
  align-self: flex-end;
  background: #6545bb;
}

.bot {
  align-self: flex-start;
  background: #242530;
}

.welcome {
  text-align: center;
  margin: auto;
  color: #c8c8d5;
}

.welcome h1 {
  font-size: 32px;
  color: #a78bfa;
}

#status {
  font-size: 12px;
  color: #aaa;
  text-align: center;
  padding: 5px;
}

footer {
  padding: 12px;
  border-top: 1px solid #292a33;
}

.inputbox {
  display: flex;
  gap: 8px;
  max-width: 850px;
  margin: auto;
  background: #242530;
  border-radius: 15px;
  padding: 9px;
}

textarea {
  flex: 1;
  resize: none;
  background: transparent;
  color: white;
  border: 0;
  outline: 0;
  font-size: 16px;
  padding: 10px;
  max-height: 120px;
}

#send {
  background: #8b5cf6;
  color: white;
  border-radius: 12px;
  padding: 0 18px;
  font-size: 17px;
}

#send:disabled {
  opacity: .5;
}

.small {
  text-align: center;
  color: #777;
  font-size: 11px;
  margin-top: 9px;
}
</style>
</head>

<body>

<header>
  <div class="logo">✦ Nova AI</div>
  <button id="newChat">+ New Chat</button>
</header>

<main id="chat">
  <div class="welcome" id="welcome">
    <h1>✦ Nova AI</h1>
    <p>What can I help you with today?</p>
  </div>
</main>

<div id="status">Ready</div>

<footer>
  <div class="inputbox">
    <textarea id="prompt"
      rows="1"
      placeholder="Message Nova AI..."></textarea>

    <button id="send">➤</button>
  </div>

  <div class="small">
    Nova AI can make mistakes. Check important information.
  </div>
</footer>

<script>
const chat = document.getElementById("chat");
const promptBox = document.getElementById("prompt");
const sendBtn = document.getElementById("send");
const statusBox = document.getElementById("status");
const welcome = document.getElementById("welcome");

let messages = [];

function addMessage(role, text) {
  welcome.style.display = "none";

  const div = document.createElement("div");

  div.className =
    "message " + (role === "user" ? "user" : "bot");

  div.textContent = text;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;

  return div;
}

async function sendMessage() {
  const text = promptBox.value.trim();

  if (!text || sendBtn.disabled) return;

  addMessage("user", text);

  messages.push({
    role: "user",
    content: text
  });

  promptBox.value = "";
  promptBox.style.height = "auto";

  sendBtn.disabled = true;
  statusBox.textContent = "Nova AI is thinking...";

  const loading = addMessage("assistant", "Thinking...");

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: messages.slice(-20)
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Something went wrong");
    }

    loading.textContent = data.reply;

    messages.push({
      role: "assistant",
      content: data.reply
    });

    statusBox.textContent = "Ready";

  } catch (error) {
    loading.textContent = "Error: " + error.message;
    statusBox.textContent = "Connection error";
    messages.pop();

  } finally {
    sendBtn.disabled = false;
    promptBox.focus();
    chat.scrollTop = chat.scrollHeight;
  }
}

sendBtn.addEventListener("click", sendMessage);

promptBox.addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

promptBox.addEventListener("input", function() {
  promptBox.style.height = "auto";
  promptBox.style.height = promptBox.scrollHeight + "px";
});

document.getElementById("newChat").addEventListener("click", function() {
  messages = [];

  chat.innerHTML = "";
  chat.appendChild(welcome);

  welcome.style.display = "block";
  statusBox.textContent = "New chat started";
});
</script>

</body>
</html>
